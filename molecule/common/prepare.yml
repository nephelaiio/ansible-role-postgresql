---
- name: Prepare
  hosts: all
  gather_facts: true
  become: true
  roles:
    - nephelaiio.postgresql_repo
  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts.os_family == 'Debian'
      changed_when: false

    - name: Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts.os_family == 'RedHat'
      changed_when: false
